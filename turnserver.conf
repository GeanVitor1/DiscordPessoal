# coturn configuration for MeuApp WebRTC Signaling & Media Relay

listening-port=3478
no-tls
no-dtls

# IPs de escuta
listening-ip=0.0.0.0

# Faixa restrita de portas UDP para Relay (evita abrir milhares de portas)
min-port=49152
max-port=49252

# Autenticação via REST API com credenciais temporárias (RFC 5766)
# Segredo, realm e IP externo são passados por argumentos no Compose.
# Arquivos montados não recebem interpolação das variáveis do Compose.

# Segurança e proteção contra abuso
stale-nonce=600
no-multicast-peers
no-cli
no-loopback-peers

# Logs
fingerprint
log-file=stdout
