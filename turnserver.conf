# coturn configuration for MeuApp WebRTC Signaling & Media Relay

listening-port=3478
tls-listening-port=5349

# IPs de escuta
listening-ip=0.0.0.0

# Faixa restrita de portas UDP para Relay (evita abrir milhares de portas)
min-port=49152
max-port=49252

# Autenticação via REST API com credenciais temporárias (RFC 5766)
use-auth-secret
static-auth-secret=${TURN_SECRET}
realm=${TURN_REALM}

# Segurança e proteção contra abuso
stale-nonce=600
no-multicast-peers
no-cli
no-loopback-peers

# Logs
verbose
fingerprint
lt-cred-mech
